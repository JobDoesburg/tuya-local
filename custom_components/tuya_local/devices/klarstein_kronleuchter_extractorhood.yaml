name: Extractor hood
products:
  - id: s2gvfeyrdaqpwgke
    manufacturer: Klarstein
    model: Kronleuchter Smart
entities:
  - entity: fan
    dps:
      - id: 1
        type: boolean
        name: switch
      - id: 10
        type: string
        name: speed
        mapping:
          - dps_val: low
            value: 25
          - dps_val: middle
            value: 50
          - dps_val: high
            value: 75
          - dps_val: strong
            value: 100

  - entity: light
    dps:
      - id: 4
        type: boolean
        name: switch
      - id: 103
        type: integer
        name: brightness
        range:
          min: 1
          max: 3

  - entity: select
    name: Ambient colour
    icon: "mdi:palette"
    dps:
      - id: 101
        type: integer
        name: option
        mapping:
          - dps_val: 0
            value: "Off"
          - dps_val: 1
            value: "White"
          - dps_val: 2
            value: "Red"
          - dps_val: 3
            value: "Green"
          - dps_val: 4
            value: "Blue"
          - dps_val: 5
            value: "Yellow"
          - dps_val: 6
            value: "Pink"
          - dps_val: 7
            value: "Orange"
          - dps_val: 8
            value: "Cyan"
          - dps_val: 9
            value: "Lime"

  - entity: number
    name: Countdown
    category: config
    dps:
      - id: 13
        type: integer
        name: value
        unit: min
        range:
          min: 0
          max: 100
